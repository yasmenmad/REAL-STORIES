<svg width="360" height="72" viewBox="0 0 360 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="filmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Cinema Reel Icon -->
  <g transform="translate(8, 6)">
    <circle cx="30" cy="30" r="28" fill="url(#filmGlow)"/>
    <circle cx="30" cy="30" r="26" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Outer Perforations -->
    <circle cx="30" cy="10" r="3.5" fill="#F59E0B"/>
    <circle cx="30" cy="50" r="3.5" fill="#F59E0B"/>
    <circle cx="10" cy="30" r="3.5" fill="#F59E0B"/>
    <circle cx="50" cy="30" r="3.5" fill="#F59E0B"/>
    <circle cx="16" cy="16" r="3.5" fill="#F59E0B"/>
    <circle cx="44" cy="44" r="3.5" fill="#F59E0B"/>
    <circle cx="16" cy="44" r="3.5" fill="#F59E0B"/>
    <circle cx="44" cy="16" r="3.5" fill="#F59E0B"/>
    <!-- Center Hub -->
    <circle cx="30" cy="30" r="9" fill="#0C0D12" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography -->
  <g transform="translate(78, 16)">
    <text x="0" y="20" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="2">REAL STORIES</text>
    <text x="0" y="36" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F59E0B" letter-spacing="2.5">HISTORICAL CINEMA ARCHIVE</text>
  </g>
</svg>
